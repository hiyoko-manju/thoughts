<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="지참약 식별">
<title>지참약 사진 식별</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="appbar">
  <div>
    <h1>지참약 사진 식별</h1>
    <p id="db-status" class="muted small"></p>
  </div>
  <button id="reset" class="btn ghost small hidden">처음부터</button>
</header>

<main>
  <p class="notice">결과는 <b>후보</b>입니다. 실물과 대조하고 최종 확인은 약사와 함께 하세요.
    환자 이름·등록번호가 찍히지 않게 해 주세요.</p>

  <section class="card" id="upload">
    <h2><span class="step">1</span> 사진 올리기</h2>
    <p class="muted small">흰 종이 위에 알약을 놓고 위에서 밝게 찍어 주세요.
      앞면 한 장, 뒤집어서 뒷면 한 장을 찍으면 더 정확합니다. (최대 6장)</p>
    <div id="previews" class="previews"></div>
    <div class="row">
      <label class="btn primary grow">📷 촬영
        <input id="camera" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="btn grow">🖼 앨범에서 선택
        <input id="album" type="file" accept="image/*" multiple hidden></label>
    </div>
    <button id="run" class="btn primary block" disabled>분석하기</button>
    <div id="progress" class="progress hidden">
      <span class="spinner"></span><span id="progress-text"></span>
    </div>
    <p id="error" class="error hidden"></p>
  </section>

  <section id="issues" class="card issues hidden"></section>
  <section id="results"></section>

  <section id="summary" class="card hidden">
    <h2><span class="step">3</span> 확인 목록</h2>
    <ol id="summary-list"></ol>
    <div class="row">
      <button id="copy" class="btn grow">📋 복사</button>
      <button class="btn grow" onclick="window.print()">🖨 인쇄</button>
    </div>
  </section>
</main>

<div id="lightbox" class="lightbox hidden"><img alt=""></div>

<script src="/static/app.js"></script>
</body>
</html>
