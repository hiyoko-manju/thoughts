# Render 블루프린트: 대시보드에서 New → Blueprint → 이 저장소 선택
services:
  - type: web
    name: pill-identifier
    runtime: python
    plan: free
    region: singapore
    branch: claude/pill-photo-identifier-attfxn
    rootDir: pill-identifier
    buildCommand: pip install -r requirements.txt && python scripts/sync_mfds.py api
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_GO_KR_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
